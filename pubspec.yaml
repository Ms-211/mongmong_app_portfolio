name: mongmong_app
description: "Public portfolio demo for a board game cafe Flutter app."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.12.1
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  youtube_player_iframe: ^5.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/db/
    - assets/images/
    - assets/images/games/
    - assets/images/menu/
